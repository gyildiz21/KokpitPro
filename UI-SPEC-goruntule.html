<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KokpitPro kanonik UI-SPEC görüntüleyicisi">
  <title>KokpitPro — UI-SPEC görüntüleyici</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #090d14; --surface: #111720; --surface-2: #151d28; --text: #edf3f8;
      --text-2: #a8b4c3; --text-3: #718096; --line: #253142; --accent: #7dd3fc;
      --accent-soft: rgba(125,211,252,.11); --warning: #e3b65a; --shadow: 0 24px 70px rgba(2,7,13,.34);
    }
    html[data-theme="light"] {
      --bg: #eef2f5; --surface: #fff; --surface-2: #f5f7f9; --text: #14202d;
      --text-2: #506174; --text-3: #7c8998; --line: #dce3e9; --accent: #036c91;
      --accent-soft: rgba(3,108,145,.08); --warning: #9a6b0f; --shadow: 0 24px 70px rgba(39,58,73,.14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI Variable", "Aptos", "Segoe UI", sans-serif; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px clamp(15px,3vw,34px); border-bottom: 1px solid var(--line); background: color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter: blur(16px); }
    .mark { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid color-mix(in srgb,var(--accent) 40%,var(--line)); border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-weight: 760; }
    .title { min-width: 0; }
    .title strong { display: block; font-size: 13px; letter-spacing: -.01em; }
    .title span { display: block; color: var(--text-3); font-size: 10.5px; }
    .spacer { flex: 1; }
    .action { display: inline-flex; align-items: center; min-height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text-2); cursor: pointer; font: 600 11px/1 "Segoe UI Variable",sans-serif; text-decoration: none; }
    .action:hover { border-color: color-mix(in srgb,var(--accent) 38%,var(--line)); color: var(--text); }
    .shell { width: min(100% - 32px, 1120px); margin: 0 auto; }
    .notice { display: flex; align-items: center; gap: 10px; margin: 24px 0 0; padding: 10px 12px; border: 1px solid color-mix(in srgb,var(--warning) 30%,var(--line)); border-radius: 9px; background: color-mix(in srgb,var(--warning) 8%,var(--surface)); color: var(--text-2); font-size: 11px; }
    .notice::before { content: ""; width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--warning); }
    main { padding: 20px 0 70px; }
    .md { padding: clamp(22px,5vw,54px); border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: var(--shadow); }
    .md h1,.md h2,.md h3 { font-family: "Segoe UI Variable Display","Aptos Display",sans-serif; line-height: 1.18; letter-spacing: -.035em; text-wrap: balance; }
    .md h1 { margin: 0 0 28px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-size: clamp(27px,4vw,42px); font-weight: 730; }
    .md h2 { margin: 48px 0 18px; padding-top: 10px; font-size: clamp(21px,2.6vw,28px); font-weight: 700; }
    .md h3 { margin: 32px 0 13px; color: var(--text); font-size: 18px; font-weight: 670; letter-spacing: -.02em; }
    .md p,.md li { color: var(--text-2); }
    .md p { max-width: 76ch; text-wrap: pretty; }
    .md strong { color: var(--text); font-weight: 680; }
    .md a { color: var(--accent); }
    .md blockquote { margin: 18px 0; padding: 14px 17px; border: 1px solid var(--line); border-left: 3px solid var(--warning); border-radius: 9px; background: var(--surface-2); }
    .md blockquote p { margin: 0; }
    .md code { padding: 2px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); color: var(--text-2); font-family: ui-monospace,"Cascadia Code",Consolas,monospace; font-size: .88em; }
    .md pre { overflow: auto; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    .md pre code { padding: 0; border: 0; background: transparent; }
    .md table { display: block; width: 100%; margin: 18px 0 24px; overflow-x: auto; border-collapse: collapse; font-size: 12px; }
    .md th,.md td { min-width: 120px; padding: 9px 11px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .md th { background: var(--surface-2); color: var(--text); font-weight: 670; }
    .md hr { margin: 38px 0; border: 0; border-top: 1px solid var(--line); }
    .error { padding: 28px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text-2); }
    @media (max-width: 700px) { .topbar .title span { display: none; } .shell { width: min(100% - 20px,1120px); } .md { padding: 20px 17px; border-radius: 11px; } .action span { display: none; } }
    @media print { .topbar,.notice { display: none; } body { background: #fff; color: #111; } .shell { width: 100%; } .md { padding: 0; border: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="mark" aria-hidden="true">K</div>
    <div class="title"><strong>KokpitPro · UI-SPEC v0.8</strong><span>Kalıcı proje kataloğu · gerçek repo bağlantısı · veri izolasyonu · karşılaştırma</span></div>
    <div class="spacer"></div>
    <a class="action" href="arayuz-onizleme.html" aria-label="Ürün önizlemesini aç"><span>Ürün önizlemesi</span></a>
    <button class="action" id="theme" type="button" aria-label="Temayı değiştir"><span>Tema</span></button>
    <button class="action" id="print" type="button" aria-label="Yazdır veya PDF kaydet"><span>Yazdır / PDF</span></button>
  </header>
  <div class="shell">
    <div class="notice">Bu görüntüleyici gömülü bir kopya tutmaz; her açılışta kanonik UI-SPEC.md dosyasını okur.</div>
    <main><article class="md" id="content" aria-live="polite">UI-SPEC yükleniyor…</article></main>
  </div>
  <script>
    const content = document.getElementById("content");
    async function loadSpec() {
      try {
        const response = await fetch("UI-SPEC.md", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        content.innerHTML = marked.parse(markdown);
      } catch (error) {
        content.className = "error";
        content.innerHTML = `<strong>UI-SPEC yüklenemedi.</strong><p>Bu görüntüleyiciyi yerel sunucu üzerinden açın ve <code>UI-SPEC.md</code> dosyasının aynı dizinde olduğunu doğrulayın.</p><p><code>${String(error.message)}</code></p>`;
      }
    }
    document.getElementById("theme").addEventListener("click", () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    });
    document.getElementById("print").addEventListener("click", () => window.print());
    loadSpec();
  </script>
</body>
</html>
